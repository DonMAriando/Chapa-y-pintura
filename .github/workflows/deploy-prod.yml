name: Deploy Prod (build + push)

on:
  push:
    tags:
      - "prod-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (prod-X.Y.Z)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject non-prod version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "$VERSION" | grep -Eq '^prod-[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "invalid version: $VERSION (expected prod-X.Y.Z)"
            exit 1
          }

      - name: Docker login (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish production images
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          bash ./scripts/deploy-prod.sh --ci "$VERSION"
