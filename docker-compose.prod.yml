name: chapa-y-pintura

services:
  web:
    image: ghcr.io/donmariando/chapa-y-pintura:prod-latest
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: "3004"
    expose:
      - "3004"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3004/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
